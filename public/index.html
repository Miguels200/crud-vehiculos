<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Vehículos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 Sistema de Gestión de Vehículos</h1>
            <p>Administra tu flota de vehículos de manera sencilla</p>
        </header>

        <main>
            <!-- Formulario para agregar/editar vehículos -->
            <section class="form-section">
                <h2 id="form-title">Agregar Nuevo Vehículo</h2>
                <form id="vehiculo-form">
                    <div class="form-group">
                        <label for="marca">Marca *</label>
                        <input type="text" id="marca" name="marca" required placeholder="Ej: Toyota">
                    </div>

                    <div class="form-group">
                        <label for="modelo">Modelo *</label>
                        <input type="text" id="modelo" name="modelo" required placeholder="Ej: Corolla">
                    </div>

                    <div class="form-group">
                        <label for="año">Año *</label>
                        <input type="number" id="año" name="año" required min="1900" max="2030" placeholder="Ej: 2023">
                    </div>

                    <div class="form-group">
                        <label for="color">Color *</label>
                        <input type="text" id="color" name="color" required placeholder="Ej: Rojo">
                    </div>

                    <div class="form-group">
                        <label for="placa">Placa *</label>
                        <input type="text" id="placa" name="placa" required placeholder="Ej: ABC-123" maxlength="10">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn btn-primary">Agregar Vehículo</button>
                        <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancelar</button>
                    </div>
                </form>
                <div id="message" class="message"></div>
            </section>

            <!-- Lista de vehículos -->
            <section class="list-section">
                <div class="list-header">
                    <h2>Vehículos Registrados</h2>
                    <span id="vehiculos-count" class="badge">0</span>
                </div>
                <div id="loading" class="loading">Cargando vehículos...</div>
                <div id="vehiculos-list" class="vehiculos-list"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
